name: Reproducible MLflow Project
on:
  pull_request:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Restore verified historical station catalog
        run: python .github/scripts/restore_catalog.py --output "${{ runner.temp }}/mibici-catalog/nomenclatura_2026_09.csv"
        env:
          MIBICI_CATALOG_ARCHIVE: ${{ secrets.MIBICI_CATALOG_2026_09_GZIP_B64 }}
      - run: python -m pytest -q -W error::DeprecationWarning
        env:
          MIBICI_CATALOG_INTEGRATION: '1'
          MIBICI_PROJECT_INTEGRATION: '1'

  monitoring:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-monitoring.txt
      - run: python -m pip install -r requirements-monitoring.txt
      - run: python -m pip check
      - run: python -m pytest tests/test_monitoring_evidently.py -q -W error::DeprecationWarning
        env:
          DO_NOT_TRACK: '1'

  container:
    needs: [test, monitoring]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: mibici-ci
      MIBICI_IMAGE: mibici-p1:ci
      MIBICI_CODE_REVISION: ${{ github.sha }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Prepare synthetic infrastructure fixture
        run: |
          python tests/create_compose_fixture.py --output "${{ runner.temp }}/compose-model"
          python -c "import json,os; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'compose-model'; j=json.loads((p/'registry.json').read_text()); f=Path(os.environ['GITHUB_ENV']); f.open('a').write('MIBICI_SOURCE_BUNDLE='+str(p)+'\\nMIBICI_EXPECTED_MODEL_SHA256='+j['model_files']['model.skops']+'\\n')"
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: services
          load: true
          tags: mibici-p1:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Confirm image does not contain a local model
        run: docker run --rm --entrypoint python mibici-p1:ci -c "from pathlib import Path; assert not Path('models/serving/p1/registry.json').exists()"
      - name: Start services and provision registered model
        run: docker compose up --no-build -d --wait --wait-timeout 240
      - name: Verify HTTP prediction and Registry lineage
        run: python scripts/smoke_compose.py --kind synthetic-ci --revision "${{ github.sha }}" --output reports/operation/ci-compose.json
      - name: Verify restart preserves registered version
        run: |
          docker compose restart api mlflow
          docker compose up --no-build -d --wait --wait-timeout 240
          python scripts/smoke_compose.py --kind synthetic-ci --revision "${{ github.sha }}" --output reports/operation/ci-compose-restart.json
          python -c "import json; from pathlib import Path; a=json.loads(Path('reports/operation/ci-compose.json').read_text()); b=json.loads(Path('reports/operation/ci-compose-restart.json').read_text()); assert a['health']['model']==b['health']['model']; assert a['prediction']==b['prediction']"
      - name: Save Compose diagnostics
        if: always()
        run: |
          mkdir -p reports/operation
          docker compose ps --all --format json > reports/operation/ci-containers.json
          docker compose logs --no-color > reports/operation/ci-compose.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-verification
          path: reports/operation/
      - name: Stop CI services
        if: always()
        run: docker compose down --volumes
