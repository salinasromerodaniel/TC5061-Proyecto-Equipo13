name: Dataset portability
on:
  pull_request:
  push:
    branches: [main, fix/portable-station-coordinates]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m pytest -q -W error::DeprecationWarning
        env:
          MIBICI_CATALOG_INTEGRATION: '1'
