name: Reproducible MLflow Project
on:
  pull_request:
  push:
    branches: [main, fix/portable-station-coordinates]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - name: Restore verified historical station catalog
        run: python .github/scripts/restore_catalog.py --output "${{ runner.temp }}/mibici-catalog/nomenclatura_2026_09.csv"
        env:
          MIBICI_CATALOG_ARCHIVE: ${{ secrets.MIBICI_CATALOG_2026_09_GZIP_B64 }}
      - run: python -m pytest -q -W error::DeprecationWarning
        env:
          MIBICI_CATALOG_INTEGRATION: '1'
          MIBICI_PROJECT_INTEGRATION: '1'
